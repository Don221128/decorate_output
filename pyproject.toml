[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "easy_decorate_output"
version = "0.4.2"
authors = [
  { name = "Don221128" }
]
description = "一個用於自訂美化終端機輸出的輕量級工具庫"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "rich>=15.0.0"
]
[tool.hatch.build.targets.wheel]
packages = ["easy_decorate_output"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["easy_decorate_output*"]